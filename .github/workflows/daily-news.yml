name: Somali Global News Automated Wire Fetcher
on: schedule: # Runs every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC) - cron: '0 */6 * * *' workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub anytime
jobs: update-news: runs-on: ubuntu-latest
permissions:
  contents: write # Grants permission to commit and push changes back to repo

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Node.js Environment
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Install Dependencies
    run: npm install @google/genai

  - name: Run News Generator Engine
    run: node fetch-somalia-news.js
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  - name: Commit and Push Updated News Payload
    run: |
      git config --global user.name "SGN Automated Wire Bot"
      git config --global user.email "bot@somaliglobalnews.com"
      git add public/data/news.json
      git commit -m "chore(news): auto-update breaking news wire feed [skip ci]" || exit 0
      git push
