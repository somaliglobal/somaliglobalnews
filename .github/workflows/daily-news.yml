name: Daily Somalia News Generation Automation

on:
  schedule:
    # Runs automatically every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual one-click triggering from GitHub UI

jobs:
  generate-and-commit-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit updated news data back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @google/genai

      - name: Run Gemini Daily News Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node fetch-somalia-news.js

      - name: Commit and Push News Data Updates
        run: |
          git config --global user.name 'SGN Automated Bot'
          git config --global user.email 'bot@somaliglobalnews.com'
          git add public/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(news): auto-update news articles [skip ci]" && git push)
