<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGN Publisher — Content Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f5f7] text-[#1d1d1f] font-sans antialiased min-h-screen">

    <!-- Login View -->
    <div id="loginView" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-[#e5e5e7]">
            <div class="w-12 h-12 bg-[#1d1d1f] text-white rounded-full flex items-center justify-center font-bold text-sm mb-4 mx-auto">
                SGN
            </div>
            <h1 class="text-2xl font-bold text-center mb-1">Editor Login</h1>
            <p class="text-xs text-[#86868b] text-center mb-6">SomaliGlobalNews Publishing Portal</p>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Admin Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter password" required 
                           class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#0071e3] text-sm">
                </div>
                <button type="submit" class="w-full bg-[#0071e3] hover:bg-blue-600 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm">
                    Authenticate
                </button>
            </form>
            <p id="loginError" class="text-red-500 text-xs text-center mt-3 hidden">Incorrect password. Please try again.</p>
        </div>
    </div>

    <!-- Admin Dashboard View -->
    <div id="dashboardView" class="hidden">
        <header class="bg-white border-b border-[#e5e5e7] sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span class="font-bold text-lg tracking-tight">SGN Admin Dashboard</span>
                    <span class="text-xs bg-blue-100 text-[#0071e3] font-semibold px-2.5 py-0.5 rounded-full">Live Editor</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="index.html" target="_blank" class="text-xs font-semibold text-[#0071e3] hover:underline">View Live Portal ↗</a>
                    <button onclick="handleLogout()" class="text-xs font-semibold text-red-600 hover:underline">
                        Sign Out
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Article Editor Form -->
            <div class="lg:col-span-1 bg-white p-6 rounded-3xl border border-[#e5e5e7] shadow-sm space-y-4 h-fit">
                <h2 class="text-lg font-bold text-[#1d1d1f]">Publish New Article</h2>
                <form onsubmit="publishArticle(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Target Category</label>
                        <select id="artCategory" required class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs font-medium focus:ring-2 focus:ring-[#0071e3]">
                            <option value="somalia">Somalia</option>
                            <option value="ethiopia">Ethiopia (Horn of Africa)</option>
                            <option value="kenya">Kenya (Horn of Africa)</option>
                            <option value="djibouti">Djibouti (Horn of Africa)</option>
                            <option value="middleeast">Middle East</option>
                            <option value="europe">Europe</option>
                            <option value="us_na">Americas</option>
                            <option value="opinion">Editorial / Op-Ed</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Article Headline / Title</label>
                        <input type="text" id="artTitle" placeholder="Paste full article title..." required 
                               class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-[#0071e3]">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">News Source Name</label>
                        <input type="text" id="artSource" placeholder="e.g. SGN Editorial, Reuters, BBC" required 
                               class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-[#0071e3]">
                    </div>

                    <!-- Media Type Selector -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Media Type</label>
                        <select id="mediaType" onchange="toggleMediaType()" class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs font-medium focus:ring-2 focus:ring-[#0071e3]">
                            <option value="image">📷 Picture (Image URL)</option>
                            <option value="video">🎥 Video Snippet (&lt; 1 min .mp4)</option>
                        </select>
                    </div>

                    <!-- Dynamic Media Input -->
                    <div id="imageInputGroup">
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Image URL</label>
                        <input type="url" id="artImage" placeholder="https://images.unsplash.com/photo-..." 
                               class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-[#0071e3]">
                    </div>

                    <div id="videoInputGroup" class="hidden">
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Video File URL (.mp4)</label>
                        <input type="url" id="artVideo" placeholder="https://.../short-clip.mp4" 
                               class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-[#0071e3]">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Short Preview Summary</label>
                        <textarea id="artDesc" rows="2" placeholder="Brief 1-2 sentence overview for news card..." required 
                                  class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-[#0071e3]"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Full Article Body (Text or HTML)</label>
                        <textarea id="artFull" rows="6" placeholder="Paste full article paragraphs here..." required 
                                  class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs focus:ring-2 focus:ring-[#0071e3]"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-[#1d1d1f] hover:bg-black text-white text-xs font-bold py-3 rounded-xl transition shadow-sm">
                        Publish Article to Portal
                    </button>
                </form>
            </div>

            <!-- Published Articles Manager -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-3xl border border-[#e5e5e7] shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-base font-bold text-[#1d1d1f]">Live Articles Management</h2>
                        <button onclick="clearAllArticles()" class="text-xs font-semibold text-red-600 hover:underline">
                            Clear Local Overrides
                        </button>
                    </div>

                    <div id="articlesList" class="space-y-4 max-h-[600px] overflow-y-auto pr-2">
                        <!-- Dynamically Injected Articles -->
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        const DEFAULT_PASS = "sgn2026"; 

        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPassword').value;
            if (pass === DEFAULT_PASS) {
                sessionStorage.setItem('sgn_authenticated', 'true');
                showDashboard();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('sgn_authenticated');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            loadManagedArticles();
        }

        function toggleMediaType() {
            const type = document.getElementById('mediaType').value;
            const imgGroup = document.getElementById('imageInputGroup');
            const vidGroup = document.getElementById('videoInputGroup');

            if (type === 'video') {
                imgGroup.classList.add('hidden');
                vidGroup.classList.remove('hidden');
            } else {
                vidGroup.classList.add('hidden');
                imgGroup.classList.remove('hidden');
            }
        }

        function getStoredData() {
            const raw = localStorage.getItem('sgn_custom_database');
            return raw ? JSON.parse(raw) : null;
        }

        function saveStoredData(data) {
            localStorage.setItem('sgn_custom_database', JSON.stringify(data));
        }

        function publishArticle(e) {
            e.preventDefault();
            
            const category = document.getElementById('artCategory').value;
            const mediaType = document.getElementById('mediaType').value;
            const fallbackImg = "https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=800&q=80";
            
            const newArticle = {
                id: 'custom-' + Date.now(),
                title: document.getElementById('artTitle').value,
                sourceName: document.getElementById('artSource').value,
                pubDate: new Date().toISOString(),
                thumbnail: mediaType === 'image' ? (document.getElementById('artImage').value.trim() || fallbackImg) : fallbackImg,
                videoUrl: mediaType === 'video' ? document.getElementById('artVideo').value.trim() : '',
                description: document.getElementById('artDesc').value,
                fullText: document.getElementById('artFull').value.replace(/\n/g, '<br><br>'),
                isCustom: true
            };

            let data = getStoredData();
            if (!data) {
                data = { somalia: [], ethiopia: [], kenya: [], djibouti: [], middleeast: [], europe: [], us_na: [], opinion: [] };
            }

            if (!data[category]) data[category] = [];
            data[category].unshift(newArticle);

            saveStoredData(data);
            alert("Article published successfully!");
            
            e.target.reset();
            toggleMediaType();
            loadManagedArticles();
        }

        function loadManagedArticles() {
            const list = document.getElementById('articlesList');
            const data = getStoredData();
            
            if (!data) {
                list.innerHTML = `<p class="text-xs text-gray-500 italic">No custom articles published yet.</p>`;
                return;
            }

            list.innerHTML = '';
            let count = 0;
            Object.keys(data).forEach(cat => {
                data[cat].forEach((art, index) => {
                    count++;
                    const item = document.createElement('div');
                    item.className = 'p-4 rounded-2xl border border-gray-200 bg-gray-50 flex items-center justify-between gap-4';
                    
                    const mediaBadge = art.videoUrl ? '<span class="text-[9px] bg-purple-100 text-purple-700 font-bold px-1.5 py-0.5 rounded">VIDEO</span>' : '<span class="text-[9px] bg-blue-100 text-blue-700 font-bold px-1.5 py-0.5 rounded">IMAGE</span>';

                    item.innerHTML = `
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <div class="w-12 h-12 rounded-xl bg-gray-200 shrink-0 flex items-center justify-center font-bold text-xs text-gray-500">
                                ${art.videoUrl ? '▶' : '🖼'}
                            </div>
                            <div class="truncate">
                                <div class="flex items-center space-x-2">
                                    <span class="text-[10px] font-bold uppercase text-[#0071e3]">${cat} • ${art.sourceName}</span>
                                    ${mediaBadge}
                                </div>
                                <h4 class="text-xs font-bold text-[#1d1d1f] truncate">${art.title}</h4>
                                <p class="text-[10px] text-gray-500">${new Date(art.pubDate).toLocaleDateString()}</p>
                            </div>
                        </div>
                        <button onclick="deleteArticle('${cat}', ${index})" class="text-xs font-semibold text-red-600 hover:underline shrink-0">
                            Delete
                        </button>
                    `;
                    list.appendChild(item);
                });
            });

            if (count === 0) {
                list.innerHTML = `<p class="text-xs text-gray-500 italic">No custom articles stored.</p>`;
            }
        }

        function deleteArticle(category, index) {
            let data = getStoredData();
            if (!data || !data[category]) return;

            data[category].splice(index, 1);
            saveStoredData(data);
            loadManagedArticles();
        }

        function clearAllArticles() {
            if (confirm("Reset local storage overrides?")) {
                localStorage.removeItem('sgn_custom_database');
                loadManagedArticles();
            }
        }

        if (sessionStorage.getItem('sgn_authenticated') === 'true') {
            showDashboard();
        }
    </script>
</body>
</html>
