<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somaliglobalnews.com — SGN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .serif-title { font-family: 'Merriweather', serif; }
        .nav-btn { transition: all 0.2s ease; border-bottom: 2px solid transparent; }
        .nav-btn.active { color: #0071e3; border-bottom-color: #0071e3; font-weight: 700; }
        .article-content { overflow-wrap: anywhere; word-break: break-word; }
    </style>
</head>
<body class="bg-[#f5f5f7] text-[#1d1d1f] min-h-screen">

    <!-- Top Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-[#e5e5e7] sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2 sm:space-x-3">
                <span class="w-8 h-8 bg-[#0071e3] text-white rounded-full flex items-center justify-center font-bold text-xs shadow-sm flex-shrink-0">SGN</span>
                <a href="index.html" class="font-bold text-base sm:text-lg tracking-tight text-[#0071e3] hover:text-[#005bb5] transition truncate">Somali Global News</a>
            </div>
            
            <div class="flex items-center space-x-3 sm:space-x-6">
                <span id="articleCount" class="text-xs text-[#86868b] font-medium hidden sm:inline">0 Stories</span>
                <button id="langToggleBtn" onclick="toggleGlobalLanguage()" class="text-[11px] sm:text-xs font-bold px-2.5 sm:px-3 py-1 bg-[#f0f4f8] hover:bg-[#e2e8f0] text-[#0071e3] rounded-full transition whitespace-nowrap">
                    Somali / EN
                </button>
            </div>
        </div>

        <!-- Navigation Bar -->
        <nav class="bg-[#f0f4f8] border-t border-[#e5e5e7]">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 flex gap-4 sm:gap-6 overflow-x-auto py-2.5 text-xs font-semibold text-[#515156] no-scrollbar">
                <button onclick="filterFeed('all')" class="nav-btn py-1 hover:text-[#0071e3] whitespace-nowrap active" data-cat="all">Home</button>
                <button onclick="filterFeed('Somalia')" class="nav-btn py-1 hover:text-[#0071e3] whitespace-nowrap" data-cat="Somalia">Somalia</button>
                <button onclick="filterFeed('Horn of Africa')" class="nav-btn py-1 hover:text-[#0071e3] whitespace-nowrap" data-cat="Horn of Africa">Horn of Africa</button>
                <button onclick="filterFeed('Middle East')" class="nav-btn py-1 hover:text-[#0071e3] whitespace-nowrap" data-cat="Middle East">Middle East</button>
                <button onclick="filterFeed('Europe')" class="nav-btn py-1 hover:text-[#0071e3] whitespace-nowrap" data-cat="Europe">Europe</button>
                <button onclick="filterFeed('Americas')" class="nav-btn py-1 hover:text-[#0071e3] whitespace-nowrap" data-cat="Americas">Americas</button>
                <button onclick="filterFeed('Sports')" class="nav-btn py-1 hover:text-[#0071e3] whitespace-nowrap" data-cat="Sports">Sports</button>
                <button onclick="filterFeed('Opinion')" class="nav-btn py-1 hover:text-[#0071e3] whitespace-nowrap" data-cat="Opinion">Editorial</button>
            </div>
        </nav>
    </header>

    <!-- News Feed Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
        <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8"></div>
    </main>

    <!-- Reader Modal -->
    <div id="readerModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl max-w-2xl w-full max-h-[90vh] sm:max-h-[85vh] overflow-y-auto p-5 sm:p-8 relative shadow-2xl border border-[#e5e5e7]">
            <button onclick="closeReader()" class="absolute top-4 right-4 sm:top-6 sm:right-6 text-gray-500 hover:text-black font-bold text-2xl w-8 h-8 flex items-center justify-center rounded-full bg-gray-100">&times;</button>
            
            <div class="flex justify-between items-center pr-10 mb-2">
                <span id="modalSource" class="text-xs font-bold text-[#0071e3] uppercase tracking-wide">Bureau</span>
                <button onclick="toggleSomaliTranslation()" class="text-[11px] font-semibold text-[#0071e3] hover:underline bg-[#f0f4f8] px-2.5 py-1 rounded-md">
                    Af-Soomaali
                </button>
            </div>

            <h2 id="modalTitle" class="text-xl sm:text-2xl font-bold mt-1 mb-2 serif-title text-[#1d1d1f] leading-snug article-content"></h2>
            <p id="modalDate" class="text-xs text-[#86868b] mb-4"></p>
            
            <div id="modalMediaContainer" class="mb-5 rounded-xl sm:rounded-2xl overflow-hidden bg-black"></div>
            
            <div id="modalBody" class="text-sm sm:text-base text-[#3a3a3c] leading-relaxed space-y-4 whitespace-pre-line article-content"></div>
            <div id="modalSomaliBody" class="text-sm sm:text-base text-[#1d1d1f] leading-relaxed space-y-4 hidden bg-amber-50/60 p-4 rounded-xl border border-amber-200/60 mt-4 whitespace-pre-line article-content"></div>
        </div>
    </div>

    <script>
        let allArticles = [];
        let filteredArticles = [];
        let currentArticle = null;
        let isSomaliMode = false;

        async function initFeed() {
            try {
                // Fetch central news.json with cache buster
                const res = await fetch('news.json?t=' + Date.now());
                if (!res.ok) throw new Error("news.json not found");
                const data = await res.json();
                allArticles = data.articles || [];
                filterFeed('all');
            } catch (err) {
                console.error("Error loading news feed:", err);
                document.getElementById('cardsGrid').innerHTML = `
                    <div class="col-span-full text-center py-16 text-red-500 text-sm">
                        Unable to load news.json. Check that the file exists in your repository root.
                    </div>`;
            }
        }

        function filterFeed(category) {
            document.querySelectorAll('nav button').forEach(btn => {
                if (btn.getAttribute('data-cat') === category) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            if (category === 'all') {
                filteredArticles = allArticles;
            } else if (category === 'Horn of Africa') {
                filteredArticles = allArticles.filter(a => 
                    a.category === 'Horn of Africa' || 
                    a.category === 'Ethiopia' || 
                    a.category === 'Kenya' || 
                    a.category === 'Djibouti'
                );
            } else {
                filteredArticles = allArticles.filter(a => a.category.toLowerCase() === category.toLowerCase());
            }

            document.getElementById('articleCount').innerText = `${filteredArticles.length} Stories`;
            renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            if (filteredArticles.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-[#86868b] text-sm">No stories published in this category yet.</div>`;
                return;
            }

            filteredArticles.forEach((art, idx) => {
                const card = document.createElement('article');
                card.className = "bg-white rounded-3xl border border-[#e5e5e7] overflow-hidden flex flex-col justify-between hover:shadow-xl transition cursor-pointer";
                card.onclick = () => openReader(idx);

                const titleText = isSomaliMode && art.title_so ? art.title_so : art.title;
                const summaryText = isSomaliMode && art.summary_so ? art.summary_so : art.summary;
                const imgSrc = art.imageUrl || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=800&q=80';

                card.innerHTML = `
                    <div>
                        <img src="${imgSrc}" class="w-full h-48 sm:h-52 object-cover" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=800&q=80'">
                        <div class="p-5 sm:p-6">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[10px] font-bold uppercase text-[#0071e3] tracking-wider">${art.category}</span>
                                <span class="text-[10px] text-[#86868b]">${art.location || ''}</span>
                            </div>
                            <h3 class="font-bold text-base sm:text-lg text-[#1d1d1f] mt-1 mb-2 serif-title leading-snug article-content">${titleText}</h3>
                            <p class="text-xs text-[#515156] line-clamp-3 article-content">${summaryText || ''}</p>
                        </div>
                    </div>
                    <div class="px-5 sm:px-6 py-4 border-t border-[#f0f0f2] text-[11px] text-[#86868b] flex justify-between items-center">
                        <span>${new Date(art.publishedAt || Date.now()).toLocaleDateString()}</span>
                        <span class="text-[#0071e3] font-semibold hover:underline">${isSomaliMode ? 'Akhri Warbixinta →' : 'Read Story →'}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openReader(idx) {
            const art = filteredArticles[idx];
            if (!art) return;
            currentArticle = art;

            document.getElementById('modalSource').innerText = `${art.category} • ${art.location || 'SGN NewsDesk'}`;
            document.getElementById('modalTitle').innerText = isSomaliMode && art.title_so ? art.title_so : art.title;
            document.getElementById('modalDate').innerText = new Date(art.publishedAt || Date.now()).toLocaleString();
            document.getElementById('modalBody').innerText = art.content || art.summary || '';
            
            const somaliBox = document.getElementById('modalSomaliBody');
            somaliBox.innerText = art.content_so || art.summary_so || "Warbixintan weli looma tarjumin Af-Soomaali.";
            somaliBox.classList.add('hidden');

            const mediaContainer = document.getElementById('modalMediaContainer');
            const imgSrc = art.imageUrl || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=800&q=80';
            mediaContainer.innerHTML = `<img src="${imgSrc}" class="w-full max-h-60 sm:max-h-80 object-cover">`;

            document.getElementById('readerModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeReader() {
            document.getElementById('readerModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function toggleSomaliTranslation() {
            const box = document.getElementById('modalSomaliBody');
            box.classList.toggle('hidden');
        }

        function toggleGlobalLanguage() {
            isSomaliMode = !isSomaliMode;
            document.getElementById('langToggleBtn').innerText = isSomaliMode ? 'English' : 'Somali / EN';
            renderCards();
        }

        document.addEventListener('DOMContentLoaded', initFeed);
    </script>
</body>
</html>
