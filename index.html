<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGN SomaliGlobalNews | Trusted Horn of Africa & Global News</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .sgn-glowing-badge {
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.45), 0 0 4px rgba(14, 165, 233, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Top Navigation Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3.5">
                <div class="sgn-glowing-badge w-11 h-11 rounded-full p-0.5 bg-gradient-to-tr from-sky-500 via-blue-600 to-cyan-300">
                    <div class="w-full h-full rounded-full bg-[#071328] flex items-center justify-center border border-sky-400/60">
                        <svg class="w-8 h-8 text-sky-400" viewBox="0 0 100 100" fill="none">
                            <circle cx="50" cy="50" r="46" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.6"/>
                            <polygon points="50,14 61,36 84,36 65,51 72,73 50,60 28,73 35,51 16,36 39,36" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
                            <text x="50" y="54" fill="#ffffff" font-family="'Inter', sans-serif" font-size="15" font-weight="900" letter-spacing="0.8" text-anchor="middle" dominant-baseline="central">SGN</text>
                        </svg>
                    </div>
                </div>
                <div>
                    <a href="index.html" class="text-xl font-black text-[#0071e3] tracking-tight hover:opacity-90 transition">SGN SomaliGlobalNews</a>
                    <p class="text-[11px] text-gray-500 font-semibold tracking-wider uppercase">Horn of Africa &amp; International News</p>
                </div>
            </div>

            <!-- Language Toggle & Admin Link -->
            <div class="flex items-center space-x-3">
                <div class="inline-flex rounded-xl bg-gray-100 p-1 border border-gray-200 text-xs font-semibold">
                    <button id="lang-en" onclick="setLanguage('en')" class="px-3 py-1.5 rounded-lg bg-white shadow-xs text-blue-700 transition">English</button>
                    <button id="lang-so" onclick="setLanguage('so')" class="px-3 py-1.5 rounded-lg text-gray-600 hover:text-gray-900 transition">Af-Soomaali</button>
                </div>
                <a href="admin.html" title="Editorial Desk" class="p-2 rounded-xl text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </a>
            </div>
        </div>

        <!-- Category Bar -->
        <div class="border-t border-gray-100 bg-gray-50/70 overflow-x-auto">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 flex space-x-2 text-xs font-semibold whitespace-nowrap">
                <button onclick="filterCategory('All')" class="cat-btn px-3.5 py-1.5 rounded-lg bg-[#0071e3] text-white transition shadow-2xs">All News</button>
                <button onclick="filterCategory('Somalia')" class="cat-btn px-3.5 py-1.5 rounded-lg text-gray-600 hover:bg-white hover:text-gray-900 transition">Somalia</button>
                <button onclick="filterCategory('Horn of Africa')" class="cat-btn px-3.5 py-1.5 rounded-lg text-gray-600 hover:bg-white hover:text-gray-900 transition">Horn of Africa</button>
                <button onclick="filterCategory('Middle East')" class="cat-btn px-3.5 py-1.5 rounded-lg text-gray-600 hover:bg-white hover:text-gray-900 transition">Middle East</button>
                <button onclick="filterCategory('World')" class="cat-btn px-3.5 py-1.5 rounded-lg text-gray-600 hover:bg-white hover:text-gray-900 transition">World</button>
                <button onclick="filterCategory('Editorial')" class="cat-btn px-3.5 py-1.5 rounded-lg text-gray-600 hover:bg-white hover:text-gray-900 transition">Editorial</button>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div id="articles-loading" class="text-center py-20 text-sm font-medium text-gray-400">Loading latest dispatches...</div>
        
        <!-- Articles Grid -->
        <div id="articles-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Reader Modal -->
    <div id="article-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-4 sm:p-6 overflow-y-auto">
        <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-gray-200">
            <div class="sticky top-0 bg-white/95 backdrop-blur-md px-6 py-4 border-b border-gray-100 flex items-center justify-between z-10">
                <span id="modal-category" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-sky-50 text-sky-700"></span>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-600 font-bold transition">&times;</button>
            </div>
            <div class="p-6 sm:p-8 space-y-5">
                <img id="modal-img" src="" alt="News Image" class="w-full h-72 sm:h-96 object-cover rounded-xl border border-gray-100 shadow-sm">
                <div class="text-xs text-gray-400 font-medium flex items-center space-x-2">
                    <span id="modal-location" class="font-bold text-gray-700"></span>
                    <span>&bull;</span>
                    <span id="modal-date"></span>
                </div>
                <h1 id="modal-title" class="text-xl sm:text-2xl font-black text-gray-900 leading-snug"></h1>
                <p id="modal-summary" class="text-sm sm:text-base font-semibold text-gray-700 border-l-4 border-[#0071e3] pl-4 py-1 italic bg-sky-50/40 rounded-r-lg"></p>
                <div id="modal-video-container" class="hidden pt-2"></div>
                <div id="modal-body" class="text-sm sm:text-base text-gray-800 leading-relaxed space-y-4 border-t border-gray-100 pt-5"></div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12 py-8 text-center text-xs text-gray-400">
        <p>&copy; 2026 SomaliGlobalNews (SGN). All rights reserved.</p>
        <p class="mt-1"><a href="admin.html" class="text-gray-400 hover:underline">Editorial Desk Access</a></p>
    </footer>

    <!-- Script to Load Articles directly from public/data/news.json -->
    <script>
        let articlesData = [];
        let currentLang = 'en';
        let currentCategory = 'All';

        async function loadNews() {
            try {
                let res = await fetch('public/data/news.json?t=' + Date.now());
                if (!res.ok) res = await fetch('data/news.json?t=' + Date.now());
                if (!res.ok) res = await fetch('news.json?t=' + Date.now());

                if (res.ok) {
                    const data = await res.json();
                    articlesData = data.articles || (Array.isArray(data) ? data : []);
                }
            } catch (err) {
                console.error("Failed to load articles:", err);
            }

            document.getElementById('articles-loading').classList.add('hidden');
            document.getElementById('articles-grid').classList.remove('hidden');
            renderArticles();
        }

        function setLanguage(lang) {
            currentLang = lang;
            const enBtn = document.getElementById('lang-en');
            const soBtn = document.getElementById('lang-so');

            if (lang === 'en') {
                enBtn.className = "px-3 py-1.5 rounded-lg bg-white shadow-xs text-blue-700 transition";
                soBtn.className = "px-3 py-1.5 rounded-lg text-gray-600 hover:text-gray-900 transition";
            } else {
                soBtn.className = "px-3 py-1.5 rounded-lg bg-white shadow-xs text-blue-700 transition";
                enBtn.className = "px-3 py-1.5 rounded-lg text-gray-600 hover:text-gray-900 transition";
            }
            renderArticles();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText.includes(cat) || (cat === 'All' && btn.innerText.includes('All News'))) {
                    btn.className = "cat-btn px-3.5 py-1.5 rounded-lg bg-[#0071e3] text-white transition shadow-2xs";
                } else {
                    btn.className = "cat-btn px-3.5 py-1.5 rounded-lg text-gray-600 hover:bg-white hover:text-gray-900 transition";
                }
            });
            renderArticles();
        }

        function renderArticles() {
            const grid = document.getElementById('articles-grid');
            grid.innerHTML = '';

            const filtered = currentCategory === 'All' 
                ? articlesData 
                : articlesData.filter(a => a.category === currentCategory);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center text-sm text-gray-400">No dispatches available in this category.</div>`;
                return;
            }

            filtered.forEach((art, idx) => {
                const title = (currentLang === 'so' && art.title_so) ? art.title_so : (art.title || 'Untitled');
                const summary = (currentLang === 'so' && art.summary_so) ? art.summary_so : (art.summary || '');
                const img = art.imageUrl || art.image || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=600&q=80';
                const dateStr = art.date || (art.publishedAt ? new Date(art.publishedAt).toLocaleDateString() : 'Recent');

                const card = document.createElement('article');
                card.className = "bg-white rounded-2xl border border-gray-200 shadow-2xs hover:shadow-md transition overflow-hidden flex flex-col cursor-pointer";
                card.onclick = () => openModal(art);

                card.innerHTML = `
                    <div class="h-48 w-full overflow-hidden bg-gray-100 relative">
                        <img src="${img}" alt="${escapeHtml(title)}" class="w-full h-full object-cover transition duration-300 hover:scale-105" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=600&q=80'">
                        <span class="absolute top-3 left-3 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-black/75 text-white backdrop-blur-xs">${escapeHtml(art.category || 'News')}</span>
                    </div>
                    <div class="p-5 flex-grow flex flex-col justify-between space-y-3">
                        <div class="space-y-2">
                            <div class="text-[11px] text-gray-400 font-semibold">${escapeHtml(art.location || 'SGN Bureau')} &bull; ${dateStr}</div>
                            <h2 class="text-base font-bold text-gray-900 leading-snug line-clamp-2">${escapeHtml(title)}</h2>
                            <p class="text-xs text-gray-600 line-clamp-3 leading-relaxed">${escapeHtml(summary)}</p>
                        </div>
                        <div class="pt-2 text-xs font-bold text-[#0071e3] flex items-center space-x-1">
                            <span>Read Full Report</span>
                            <span>&rarr;</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(art) {
            const title = (currentLang === 'so' && art.title_so) ? art.title_so : (art.title || 'Untitled');
            const summary = (currentLang === 'so' && art.summary_so) ? art.summary_so : (art.summary || '');
            const content = (currentLang === 'so' && art.content_so) ? art.content_so : (art.content || '');
            const img = art.imageUrl || art.image || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=800&q=80';
            const dateStr = art.date || (art.publishedAt ? new Date(art.publishedAt).toLocaleDateString() : 'Recent');

            document.getElementById('modal-category').innerText = art.category || 'News';
            document.getElementById('modal-img').src = img;
            document.getElementById('modal-location').innerText = art.location || 'SGN Bureau';
            document.getElementById('modal-date').innerText = dateStr;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-summary').innerText = summary;

            // Video embed handling
            const vidContainer = document.getElementById('modal-video-container');
            if (art.videoUrl) {
                let embedUrl = art.videoUrl;
                if (embedUrl.includes('watch?v=')) {
                    embedUrl = embedUrl.replace('watch?v=', 'embed/');
                }
                vidContainer.innerHTML = `<iframe class="w-full h-64 rounded-xl shadow-xs" src="${embedUrl}" frameborder="0" allowfullscreen></iframe>`;
                vidContainer.classList.remove('hidden');
            } else {
                vidContainer.classList.add('hidden');
                vidContainer.innerHTML = '';
            }

            // Paragraphs handling
            const bodyEl = document.getElementById('modal-body');
            bodyEl.innerHTML = content.split('\n\n').map(p => `<p>${escapeHtml(p)}</p>`).join('');

            document.getElementById('article-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('article-modal').classList.add('hidden');
            document.getElementById('modal-video-container').innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        document.addEventListener('DOMContentLoaded', loadNews);
    </script>
</body>
</html>
